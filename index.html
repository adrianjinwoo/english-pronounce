<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미국식 발음 & IPA 검색기 (Pro)</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f9f9fb;
      --text: #2f3437;
      --text-sub: #787774;
      --border: #e9e9e8;
      --accent: #2383e2;
      --accent-hover: #1b6ec2;
      --chip-bg: #efefef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --text: #ffffff;
        --text-sub: #9b9a97;
        --border: #2f2f2f;
        --accent: #3a8ee6;
        --chip-bg: #2d2d2d;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .widget-container { width: 100%; max-width: 440px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
    .title { font-size: 14px; font-weight: 600; color: var(--text-sub); margin-bottom: 12px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); }
    .search-btn { padding: 10px 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .search-btn:hover { background: var(--accent-hover); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .chip { font-size: 12px; background: var(--chip-bg); color: var(--text-sub); padding: 4px 10px; border-radius: 12px; cursor: pointer; user-select: none; }
    .chip:hover { color: var(--text); }
    .result-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .word-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .base-badge { font-size: 11px; background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; font-weight: normal; vertical-align: middle; }
    .ipa-display { font-size: 18px; color: var(--accent); font-family: "Courier New", Courier, monospace; margin-bottom: 16px; letter-spacing: 0.5px; }
    .actions { display: flex; gap: 8px; justify-content: center; }
    .action-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .action-btn:hover { background: var(--chip-bg); }
    .status-msg { font-size: 12px; color: var(--text-sub); margin-top: 10px; min-height: 16px; }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="title">🇺🇸 스마트 영어 발음 검색기</div>

  <div class="input-row">
    <input type="text" id="wordInput" placeholder="단어 입력 (예: rockets, studied)" value="rockets" />
    <button class="search-btn" id="searchBtn">검색</button>
  </div>

  <div class="chips">
    <span class="chip" onclick="quickSearch('rockets')">rockets</span>
    <span class="chip" onclick="quickSearch('studied')">studied</span>
    <span class="chip" onclick="quickSearch('running')">running</span>
    <span class="chip" onclick="quickSearch('schedule')">schedule</span>
  </div>

  <div class="result-box">
    <div class="word-title" id="displayWord">rockets</div>
    <div class="ipa-display" id="displayIpa">/ˈrɑː.kɪt/</div>
    <div class="actions">
      <button class="action-btn" id="listenBtn">🔊 미국식 발음 듣기</button>
      <button class="action-btn" id="copyBtn">📋 기호 복사</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<script>
  let originalSearchWord = 'rockets';
  let currentIpa = '';
  let currentAudioUrl = null;

  const wordInput = document.getElementById('wordInput');
  const searchBtn = document.getElementById('searchBtn');
  const displayWord = document.getElementById('displayWord');
  const displayIpa = document.getElementById('displayIpa');
  const listenBtn = document.getElementById('listenBtn');
  const copyBtn = document.getElementById('copyBtn');
  const statusMsg = document.getElementById('statusMsg');

  // 단어 원형 추출 알고리즘 (복수형, 과거형, 진행형)
  function getBaseWords(w) {
    let bases = [];
    if (w.length <= 3) return bases;
    if (w.endsWith('ies')) bases.push(w.slice(0, -3) + 'y');
    if (w.endsWith('es')) { bases.push(w.slice(0, -2)); bases.push(w.slice(0, -1)); }
    if (w.endsWith('s') && !w.endsWith('ss')) bases.push(w.slice(0, -1));
    if (w.endsWith('ing')) { bases.push(w.slice(0, -3)); bases.push(w.slice(0, -3) + 'e'); }
    if (w.endsWith('ed')) { bases.push(w.slice(0, -2)); bases.push(w.slice(0, -1)); }
    return bases;
  }

  async function fetchAPI(word) {
    try {
      const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if (res.ok) return await res.json();
    } catch (e) { return null; }
    return null;
  }

  async function searchWord(query) {
    const word = query.trim().toLowerCase();
    if (!word) return;

    statusMsg.innerText = '검색 중...';
    originalSearchWord = word;
    
    // 1차 시도: 입력한 단어 그대로 검색
    let data = await fetchAPI(word);
    let isBaseWordUsed = false;
    let foundWord = word;

    // 2차 시도: 못 찾았을 경우 원형으로 변환하여 재검색 (예: rockets -> rocket)
    if (!data) {
      const bases = getBaseWords(word);
      for (let base of bases) {
        data = await fetchAPI(base);
        if (data) {
          isBaseWordUsed = true;
          foundWord = base;
          break;
        }
      }
    }

    if (data) {
      const entry = data[0];
      let foundIpa = entry.phonetic || '';
      currentAudioUrl = null;

      // 미국식 오디오 우선 추출
      if (entry.phonetics && entry.phonetics.length > 0) {
        const usPhonetic = entry.phonetics.find(p => p.audio && p.audio.includes('-us'));
        if (usPhonetic) {
          currentAudioUrl = usPhonetic.audio;
          if (usPhonetic.text) foundIpa = usPhonetic.text;
        } else {
          const fallback = entry.phonetics.find(p => p.text || p.audio);
          if (fallback) {
            if (fallback.text) foundIpa = fallback.text;
            if (fallback.audio) currentAudioUrl = fallback.audio;
          }
        }
      }

      currentIpa = foundIpa || '발음 기호 없음';
      
      // UI 업데이트
      if (isBaseWordUsed) {
        displayWord.innerHTML = `${word} <span class="base-badge">원형: ${foundWord}</span>`;
        statusMsg.innerText = `사전에 등재된 원형('${foundWord}') 기준으로 검색되었습니다.`;
      } else {
        displayWord.innerHTML = word;
        statusMsg.innerText = '';
      }
      displayIpa.innerText = currentIpa;

    } else {
      // 모든 시도 실패 시
      currentIpa = '기호 미지원 (음성 재생 가능)';
      currentAudioUrl = null;
      displayWord.innerHTML = word;
      displayIpa.innerText = currentIpa;
      statusMsg.innerText = '사전 API에 없는 단어는 고품질 브라우저 TTS로 자동 재생됩니다.';
    }
  }

  function playSound() {
    // 오디오 파일이 있으면 원형 오디오 재생, 없으면 원본 단어(복수형 등)를 TTS로 재생
    if (currentAudioUrl) {
      const audio = new Audio(currentAudioUrl);
      audio.play().catch(() => playSpeechFallback());
    } else {
      playSpeechFallback();
    }
  }

  function playSpeechFallback() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      // TTS는 항상 사용자가 입력한 원래 단어(rockets 등)를 읽도록 설정
      const utter = new SpeechSynthesisUtterance(originalSearchWord);
      utter.lang = 'en-US';
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    } else {
      alert('이 브라우저는 음성 재생을 지원하지 않습니다.');
    }
  }

  function copyIpa() {
    if (!currentIpa || currentIpa.includes('없음') || currentIpa.includes('미지원')) {
      statusMsg.innerText = '복사할 발음 기호가 없습니다.';
      return;
    }
    navigator.clipboard.writeText(currentIpa).then(() => {
      statusMsg.innerText = '✅ 클립보드에 복사되었습니다!';
      setTimeout(() => { if(statusMsg.innerText.includes('복사')) statusMsg.innerText = ''; }, 2000);
    });
  }

  function quickSearch(w) {
    wordInput.value = w;
    searchWord(w);
  }

  searchBtn.addEventListener('click', () => searchWord(wordInput.value));
  wordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchWord(wordInput.value);
  });
  listenBtn.addEventListener('click', playSound);
  copyBtn.addEventListener('click', copyIpa);

  // 초기 단어 로드
  searchWord('rockets');
</script>

</body>
</html>
