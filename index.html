<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미국식 발음 & IPA 검색기</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f9f9fb;
      --text: #2f3437;
      --text-sub: #787774;
      --border: #e9e9e8;
      --accent: #2383e2;
      --accent-hover: #1b6ec2;
      --chip-bg: #efefef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --text: #ffffff;
        --text-sub: #9b9a97;
        --border: #2f2f2f;
        --accent: #3a8ee6;
        --chip-bg: #2d2d2d;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .widget-container { width: 100%; max-width: 440px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
    .title { font-size: 14px; font-weight: 600; color: var(--text-sub); margin-bottom: 12px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); }
    .search-btn { padding: 10px 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .search-btn:hover { background: var(--accent-hover); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .chip { font-size: 12px; background: var(--chip-bg); color: var(--text-sub); padding: 4px 10px; border-radius: 12px; cursor: pointer; user-select: none; }
    .chip:hover { color: var(--text); }
    .result-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px; text-align: center; }
    .word-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .ipa-display { font-size: 19px; color: var(--accent); font-family: "Courier New", Courier, monospace; margin-bottom: 16px; letter-spacing: 0.5px; font-weight: 600; }
    .actions { display: flex; gap: 8px; justify-content: center; }
    .action-btn { display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .action-btn:hover { background: var(--chip-bg); }
    .status-msg { font-size: 12px; color: var(--text-sub); margin-top: 10px; min-height: 16px; }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="title">🇺🇸 미국식 발음 & IPA 검색기</div>

  <div class="input-row">
    <input type="text" id="wordInput" placeholder="단어 입력 (예: apple, rockets)" value="apple" />
    <button class="search-btn" id="searchBtn">검색</button>
  </div>

  <div class="chips">
    <span class="chip" onclick="quickSearch('apple')">apple</span>
    <span class="chip" onclick="quickSearch('rockets')">rockets</span>
    <span class="chip" onclick="quickSearch('schedule')">schedule</span>
    <span class="chip" onclick="quickSearch('comfortable')">comfortable</span>
  </div>

  <div class="result-box">
    <div class="word-title" id="displayWord">apple</div>
    <div class="ipa-display" id="displayIpa">/ˈæp.əl/</div>
    <div class="actions">
      <button class="action-btn" id="listenBtn">🔊 미국식 발음 듣기</button>
      <button class="action-btn" id="copyBtn">📋 기호 복사</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<script>
  let currentTargetWord = 'apple';
  let currentIpa = '/ˈæp.əl/';
  let currentAudioUrl = null;

  const wordInput = document.getElementById('wordInput');
  const searchBtn = document.getElementById('searchBtn');
  const displayWord = document.getElementById('displayWord');
  const displayIpa = document.getElementById('displayIpa');
  const listenBtn = document.getElementById('listenBtn');
  const copyBtn = document.getElementById('copyBtn');
  const statusMsg = document.getElementById('statusMsg');

  // Datamuse API (IPA 전용 백업망: 복수형, 파생형 등 모든 단어 지원)
  async function fetchDatamuseIpa(word) {
    try {
      const res = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(word)}&md=r&ipa=1&max=1`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.length > 0 && data[0].tags) {
          const tag = data[0].tags.find(t => t.startsWith('ipa_pron:'));
          if (tag) return '/' + tag.replace('ipa_pron:', '') + '/';
        }
      }
    } catch (e) {}
    return null;
  }

  // 메인 검색 함수
  async function searchWord(query) {
    const word = query.trim().toLowerCase();
    if (!word) return;

    statusMsg.innerText = '검색 중...';
    currentTargetWord = word;
    currentAudioUrl = null;
    let foundIpa = '';

    try {
      // 1. dictionaryapi.dev 조회
      const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if (res.ok) {
        const data = await res.json();
        const entry = data[0];

        // [버그 수정 1] 발음 기호 추출: 최상단 phonetic 확인 후 phonetics 배열 전수 검사
        if (entry.phonetic && entry.phonetic.trim()) {
          foundIpa = entry.phonetic.trim();
        } else if (entry.phonetics && entry.phonetics.length > 0) {
          const itemWithText = entry.phonetics.find(p => p.text && p.text.trim());
          if (itemWithText) foundIpa = itemWithText.text.trim();
        }

        // [버그 수정 2] 오디오 추출: 텍스트 유무와 상관없이 미국식(-us) 오디오 우선 탐색
        if (entry.phonetics && entry.phonetics.length > 0) {
          const usAudio = entry.phonetics.find(p => p.audio && p.audio.includes('-us'));
          if (usAudio && usAudio.audio) {
            currentAudioUrl = usAudio.audio;
          } else {
            const anyAudio = entry.phonetics.find(p => p.audio && p.audio.trim());
            if (anyAudio && anyAudio.audio) currentAudioUrl = anyAudio.audio;
          }
        }
      }
    } catch (e) {}

    // 2. 만약 기호를 못 찾았거나 복수형 등으로 404가 났다면 Datamuse 백업망 가동
    if (!foundIpa) {
      const backupIpa = await fetchDatamuseIpa(word);
      if (backupIpa) {
        foundIpa = backupIpa;
      }
    }

    // 3. 최종 결과 렌더링
    currentIpa = foundIpa || '기호 미지원';
    displayWord.innerText = word;
    displayIpa.innerText = currentIpa;
    statusMsg.innerText = '';
  }

  function playSound() {
    if (currentAudioUrl) {
      const audio = new Audio(currentAudioUrl);
      audio.play().catch(() => playSpeechFallback());
    } else {
      playSpeechFallback();
    }
  }

  function playSpeechFallback() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(currentTargetWord);
      utter.lang = 'en-US';
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    } else {
      alert('이 브라우저는 음성 재생을 지원하지 않습니다.');
    }
  }

  function copyIpa() {
    if (!currentIpa || currentIpa.includes('미지원')) {
      statusMsg.innerText = '복사할 발음 기호가 없습니다.';
      return;
    }
    navigator.clipboard.writeText(currentIpa).then(() => {
      statusMsg.innerText = '✅ 클립보드에 복사되었습니다!';
      setTimeout(() => { if (statusMsg.innerText.includes('복사')) statusMsg.innerText = ''; }, 2000);
    });
  }

  function quickSearch(w) {
    wordInput.value = w;
    searchWord(w);
  }

  searchBtn.addEventListener('click', () => searchWord(wordInput.value));
  wordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchWord(wordInput.value);
  });
  listenBtn.addEventListener('click', playSound);
  copyBtn.addEventListener('click', copyIpa);

  // 초기 단어 실행
  searchWord('apple');
</script>

</body>
</html>
